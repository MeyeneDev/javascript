<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="js_tutorials.css">
  <title>rock paper scissors game</title>
</head>
<body>
  <div class="wrapper">
    <h1>Rock Paper Scissors</h1>
    <div class="wrapper__btn">
      <button title="rock" class="btn">
        <img src="img/rock-emoji.png" name="rpsImg" alt="rock">
      </button>
      
      <button title="paper" class="btn">
        <img src="img/paper-emoji.png" name="rpsImg" alt="paper">
      </button>

      <button title="scissors" class="btn">
        <img src="img/scissors-emoji.png" name="rpsImg" alt="scissors">
      </button>
      
    </div>
    <div class="divbtn">
      <button class="reset_btn reset">
        Reset Score
      </button>
      <button class="reset_btn autoplay">
        Auto Play
      </button>
    </div>
    <div id="scoreBoard" class="score_board"></div>
    <div id="gameMove" class="game_moves"></div>
    <div class="result"></div>
    
  </div>
  <div class="author">
    <span class="small">powered by</span> <span class="bold">GG</span> engine
  </div>
  <script src="game-rps.js">
  </script>
  
</body>
</html>
