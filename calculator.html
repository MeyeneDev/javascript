<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
  <style>
    button {

      border: none;
      color:white;
      padding: 8px 24px;
      margin-inline: 4px;
      margin-block: 8px;
      border-radius: 24px;
      border-bottom: 2.5px solid hsl(0, 40%, 30%);
      font-weight: 600;
      font-size: 22px;
      text-transform: capitalize;
      text-shadow: 0 -1px 1px black;
      cursor: pointer;
      transition: background-color .4s;

    button:hover {
      background-color: hsl(0, 60%, 65%);
      border: none;
    }

    div {

      background-color: hsl(150, 20%, 25%);
      inline-size: 250px;
      padding-block: 16px;
      /* padding-inline: 10px; */
      border-radius: 54px;text-align: center;
    }
  </style>
  
</head>

      "
