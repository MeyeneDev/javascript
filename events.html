<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>events</title>
  <style>
    html{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body{
      padding: 0;
      margin-inline: 2.5%;
    }
    #hr{
      display: flex;
      justify-content: center;
      font-weight: 600;
      color: hsl(0, 99%, 10%);
    }
     button, .subs {
      background-color: hsl(0, 40%, 65%);
      flex: 1;
      border: none;
      color:white;
      padding: 12px 69px;
      margin-block: 8px;
      border-radius: 24px;
      border-bottom: 2.5px solid hsl(0, 40%, 30%);
      font-weight: 600;
      font-size: 22px;
      text-transform: capitalize;
      text-shadow: 0 -1.5px 1px hsl(0, 40%, 30%);
      cursor: pointer;
      transition: background-color .4s;

    }
    .red {
      background-color: hsl(0, 40%, 45%);
    }
    .par{
      display: flex;
      flex-flow: row wrap;
      gap: 8px;
    }
  </style>
</head>
<body> 
 <div class=" par">
    <button class="subs">
      Subscribe
    </button>
    <button class="subs">
      Subscribe
    </button>
    <button class="subs key">
      Subscribe
    </button>
    <button class="subs">
      Subscribe
    </button>
 </div> 
 

  <script type="module" src="event.js">   
  </script>

</html>
