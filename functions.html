    /* Arrow functions inherit the this value of the context where they

    //bind()

    // bind()
   /* The bind() method does more than just bind a function to an object, however. 
    It can also perform partial application: any arguments you pass to bind() after the first are
    bound along with the this value. This partial application feature of bind() does work
    with arrow functions. Partial application is a common technique in functional pro‐
    gramming and is sometimes called currying. Here are some examples of the bind()

    let sum = (x,y) => x + y; // Return the sum of 2 args

    //Example 8-2. Using functions as data

        return operators[operation](operand1, operand2);

       //Example 8-2. Private property accessor methods using closures
        // This function adds property accessor methods for a property with
        // the specified name to the object o. The methods are named get<name>
        // and set<name>. If a predicate function is supplied, the setter
        // method uses it to test its argument for validity before storing it.
        // If the predicate returns false, the setter method throws an exception.
        //
        // The unusual thing about this function is that the property value
        // that is manipulated by the getter and setter methods is not stored in
        // the object o. Instead, the value is stored only in a local variable
        // in this function. The getter and setter methods are also defined
        // locally to this function and therefore have access to this local variable.
        // This means that the value is private to the two accessor methods, and it
        // cannot be set or modified except through the setter method.
        function addPrivateProperty(o, name, predicate) {
          let value; // This is the property value

          // The getter method simply returns the value.
          o[`get${name}`] = function() { return value; };

          // The setter method stores the value or throws an exception if the predicate rejects the value.
          o[`set${name}`] = function(v) {
            if (predicate && !predicate(v)) {
              throw new TypeError(`set${name}: invalid value ${v}`)
              } else {
              value = v
            };
          }
        }

        // The following code demonstrates the addPrivateProperty() method.
        let y = {}; // Here is an empty object
