    <style>

      html, h2, h3 {
        padding: 0;
        margin: 0;
        font-family: sans-serif;
      }
    button, .subs {
      background-color: hsl(0, 40%, 65%);
      border: none;
      color:white;
      padding: 12px 60px;
      margin-block: 8px;
      border-radius: 24px;
      border-bottom: 2.5px solid hsl(0, 40%, 30%);
      font-weight: 600;
      font-size: 22px;
      text-transform: capitalize;
      text-shadow: 0 -1.5px 1px hsl(0, 40%, 30%);
      cursor: pointer;
      transition: background-color .4s;

    }
    button:hover, .subs:hover {
      background-color: hsl(0, 60%, 65%);
      border: none;
    }
    button:active,  .subs:active {
      background-color: hsl(0, 60%, 50%);
      border: none;
    }
    .subs-state {
      background-color: hsl(0, 40%, 90%);
      color: hsl(0, 40%, 65%);
       text-shadow: 0 -1px 1px hsl(0, 40%, 30%);
      border: none;
    }
    .subs-state:hover {
      background-color: hsl(0, 40%, 90%);
      color: hsl(0, 40%, 65%);
       text-shadow: 0 -1px 1px hsl(0, 40%, 30%);
      border: none;
      cursor: default;
    }
    button:active,  .subs:active {
       background-color: hsl(0, 40%, 90%);
      color: hsl(0, 40%, 65%);
       text-shadow: 0 -1px 1px hsl(0, 40%, 30%);
      border: none;
    }


    input {padding-inline-start: 18px;
      margin-block: 8px;
      block-size: 38px;
      border-radius: 24px;
      font-size: 18px;
    }
    div {

      flex-flow: column nowrap;
      margin-block-start: 35px;
      margin-inline: auto;

    .cost-display {

      font-size: 22px;

    .calc {

    }
    .red {
